# CLA enforcement (CLA Assistant Lite, contributor-assistant/github-action).
# Every pull request needs a one-time CLA signature: the bot posts instructions,
# the contributor comments the sign phrase from CLA.md, the signature is
# recorded on the `cla-signatures` branch of this repository and the status
# check turns green. Runs entirely on GITHUB_TOKEN — no external service.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/canvas-ui/canvas-server/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'idncsk,*[bot]'
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA.'
